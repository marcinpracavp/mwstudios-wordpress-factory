services:

  app:
    image: mcr.microsoft.com/devcontainers/base:ubuntu-24.04
    command: sleep infinity

    environment:
      FACTORY_RUNTIME: docker
      FACTORY_WP_ROOT: /wordpress
      FACTORY_LOCAL_URL: http://wordpress
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wp
      WORDPRESS_DB_PASSWORD: wp
      WORDPRESS_DB_NAME: wp

    volumes:
      - ..:/workspace:cached
      - wordpress-data:/wordpress

  wordpress:
    image: wordpress:latest

    ports:
      - "8000:80"

    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wp
      WORDPRESS_DB_PASSWORD: wp
      WORDPRESS_DB_NAME: wp

      WORDPRESS_CONFIG_EXTRA: |
        if (!empty($$_SERVER['HTTP_X_FORWARDED_HOST'])) {
            $$forwardedHost = trim(explode(',', $$_SERVER['HTTP_X_FORWARDED_HOST'])[0]);

            $$_SERVER['HTTP_HOST'] = $$forwardedHost;
            $$_SERVER['SERVER_NAME'] = $$forwardedHost;
        }

        if (
            isset($$_SERVER['HTTP_X_FORWARDED_PROTO']) &&
            strpos($$_SERVER['HTTP_X_FORWARDED_PROTO'], 'https') !== false
        ) {
            $$_SERVER['HTTPS'] = 'on';
            $$_SERVER['SERVER_PORT'] = '443';
            $$_SERVER['REQUEST_SCHEME'] = 'https';
        }

        if (!empty($$_SERVER['HTTP_X_FORWARDED_HOST'])) {
            $$publicHost = trim(explode(',', $$_SERVER['HTTP_X_FORWARDED_HOST'])[0]);
            $$publicUrl = 'https://' . $$publicHost;

            if (!defined('WP_HOME')) {
                define('WP_HOME', $$publicUrl);
            }

            if (!defined('WP_SITEURL')) {
                define('WP_SITEURL', $$publicUrl);
            }
        }

    volumes:
      - wordpress-data:/var/www/html
      - ..:/var/www/html/wp-content/themes/mwstudios-wordpress-factory:cached
      - ./uploads.ini:/usr/local/etc/php/conf.d/uploads.ini:ro

    depends_on:
      - db

  wpcli:
    image: wordpress:cli

    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wp
      WORDPRESS_DB_PASSWORD: wp
      WORDPRESS_DB_NAME: wp

    volumes:
      - wordpress-data:/var/www/html
      - ..:/var/www/html/wp-content/themes/mwstudios-wordpress-factory:cached

    depends_on:
      - db
      - wordpress

    entrypoint: ["sh", "-c", "sleep infinity"]

  db:
    image: mysql:8.0

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: wp
      MYSQL_USER: wp
      MYSQL_PASSWORD: wp

    volumes:
      - db-data:/var/lib/mysql

volumes:
  wordpress-data:
  db-data:
